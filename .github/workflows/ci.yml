name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # Node 26 目前是 Current 版本,失败只做提示,不阻塞合并
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        experimental: [false]
        include:
          - node: 26
            experimental: true
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      # 含类型测试与内存测试(vitest 配置里已带 --expose-gc)
      - run: pnpm run test
      # 只在一个版本上跑覆盖率,避免重复
      - run: pnpm run test:coverage
        if: matrix.node == 24
      - run: pnpm run build
      - run: pnpm run test:package
